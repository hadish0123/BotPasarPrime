name: Normalize PRIMEVPN branding

on:
  push:
    branches: [rebuild/production-v1]

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild/production-v1
      - name: Replace public brand
        run: |
          python - <<'PY'
          from pathlib import Path
          for p in Path('.').rglob('*'):
              if not p.is_file() or '.git' in p.parts:
                  continue
              try:
                  s = p.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              if '3XSHOP' in s:
                  p.write_text(s.replace('3XSHOP', 'PRIMEVPN'), encoding='utf-8')
          PY
      - name: Commit normalized branding
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No 3XSHOP branding found.'
            exit 0
          fi
          git commit -m 'brand: replace public 3XSHOP branding with PRIMEVPN'
          git push origin HEAD:rebuild/production-v1
